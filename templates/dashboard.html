# Create dashboard.html  
@"
<!DOCTYPE html>
<html>
<head>
    <title>Threat Detection Dashboard</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css' rel='stylesheet'>
    <style>
        body{background:#1a1a2e; color:white; font-family:'Segoe UI',sans-serif}
        .card{border:none; border-radius:20px; background:rgba(255,255,255,0.05); backdrop-filter:blur(10px)}
        .stat-card{background:linear-gradient(45deg,#ff6b6b,#ee5a52); border-radius:15px}
        .analyze-btn{background:linear-gradient(45deg,#00d4aa,#00b894); border:none; border-radius:25px; padding:15px 40px; font-size:18px; font-weight:bold}
    </style>
</head>
<body>
    <nav class='navbar navbar-dark bg-dark'>
        <div class='container'>
            <span class='navbar-brand'><i class='fas fa-shield-alt'></i> AI Threat Detection</span>
        </div>
    </nav>
    
    <div class='container mt-5'>
        <h1 class='mb-4'><i class='fas fa-chart-line'></i> Security Dashboard</h1>
        
        <!-- Stats -->
        <div class='row mb-5'>
            <div class='col-md-3'><div class='card stat-card p-4 text-center text-white'><h2 id='totalTraffic'>0</h2><p>Total Traffic</p></div></div>
            <div class='col-md-3'><div class='card bg-danger p-4 text-center text-white'><h2 id='threatCount'>0</h2><p>Threats</p></div></div>
            <div class='col-md-3'><div class='card bg-warning p-4 text-center text-white'><h2>92.5%</h2><p>Accuracy</p></div></div>
            <div class='col-md-3'><div class='card bg-success p-4 text-center text-white'><h2 id='responseTime'>0.2s</h2><p>Response</p></div></div>
        </div>
        
        <!-- Analyze Button -->
        <div class='card p-4 mb-4'>
            <h3><i class='fas fa-bolt text-warning'></i> Real-time Analysis</h3>
            <button id='analyzeBtn' class='analyze-btn'><i class='fas fa-play'></i> Analyze Network Traffic</button>
            <div id='status' class='mt-3'></div>
        </div>
        
        <!-- Results Table -->
        <div class='card'>
            <div class='card-header'><h5><i class='fas fa-table'></i> Threat Alerts</h5></div>
            <div class='card-body'>
                <table class='table table-dark table-hover'>
                    <thead><tr><th>ID</th><th>Severity</th><th>Score</th><th>Action</th><th>Time</th></tr></thead>
                    <tbody id='threatTable'></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    document.getElementById('analyzeBtn').onclick = async ()=>{
        const btn = document.getElementById('analyzeBtn');
        btn.innerHTML = '<i class=fa fa-spinner fa-spin></i> Analyzing...';
        btn.disabled = true;
        
        try{
            const res = await fetch('/api/analyze');
            const data = await res.json();
            
            document.getElementById('totalTraffic').textContent = data.total_traffic;
            document.getElementById('threatCount').textContent = data.threat_count;
            
            document.getElementById('status').innerHTML = 
                `<div class='alert alert-success'>✅ Analysis Complete! ${data.threat_count} threats detected</div>`;
            
            // Add table rows
            const table = document.getElementById('threatTable');
            table.innerHTML = '';
            for(let i=0; i<data.threats.length; i++){
                table.innerHTML += `
                    <tr>
                        <td>${i+1}</td>
                        <td><span class='badge bg-danger'>HIGH</span></td>
                        <td>${data.threats[i].score.toFixed(2)}</td>
                        <td><span class='badge bg-warning'>QUARANTINE</span></td>
                        <td>${new Date().toLocaleTimeString()}</td>
                    </tr>`;
            }
        }catch(e){
            document.getElementById('status').innerHTML = '<div class=alert alert-danger>Error analyzing traffic</div>';
        }
        
        btn.innerHTML = '<i class=fas fa-play></i> Re-analyze';
        btn.disabled = false;
    };
    </script>
</body>
</html>
"@ | Out-File "templates\dashboard.html" -Encoding UTF8
